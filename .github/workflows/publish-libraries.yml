name: Publish Libraries

# Veröffentlicht alle Libraries mit Tag "publishable" (siehe nx.json release.projects)
# in GitHub Packages unter dem @panary-Scope.
#
# Trigger:
#   - Automatisch bei Tag-Push "v*" (z.B. v26.5.0) → echtes Publishing.
#     Release-Ablauf siehe docs/adr/0002-library-publishing.md.
#   - Manuell via workflow_dispatch (Default Dry-Run zum sicheren Testen;
#     dry-run='false' publiziert die aktuell in den package.json stehende Version).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-Run (kein tatsächliches Publishing)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      # Cloud-Pattern: keine `version:` setzen — die Action liest die pnpm-
      # Version aus dem `packageManager`-Feld der package.json. Beide
      # gleichzeitig kollidieren mit ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@panary'

      # Gate gegen die stille Klasse (#242): Ein Release-Commit, der die publishable
      # Manifeste nicht mitbumpt, laesst `nx release publish` unten die bereits
      # veroeffentlichte Vorversion erneut hochladen — der Schritt meldet dabei
      # SUCCESS und hat nichts publiziert. Vier der v26.8.*-Releases sind so
      # durchgelaufen (26.8.{1,6,15,21}) und mussten von Hand geheilt werden;
      # aufgefallen ist es jedes Mal zufaellig, bei 26.8.21 erst beim Cloud-Pin-Bump,
      # nachdem Edge-Image und POS-Release bereits gebaut waren.
      #
      # Nur bei Tag-Push: Der workflow_dispatch-Pfad publiziert bewusst "die aktuell
      # in den package.json stehende Version" (so wurde 26.8.21 geheilt) — dort gibt
      # es keine Tag-Version zum Vergleichen.
      #
      # Steht vor `Install`, weil der Check nichts ausser node braucht: Der Fehlerfall
      # kostet damit Sekunden statt der vollen Installation.
      - name: Lib-Versionen gegen Tag-Version pruefen
        if: ${{ github.event_name == 'push' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node tools/scripts/publishable-manifests.mjs --check "$TAG_NAME"

      # `--no-frozen-lockfile`: das committete pnpm-lock.yaml ist im Workbench-Setup
      # ein Snapshot des geteilten Root-Lockfiles (Symlink + skip-worktree). Dessen
      # `overrides` sind die Vereinigung beider Repos und matchen die Standalone-
      # package.json-overrides nicht — frozen bräche mit ERR_PNPM_LOCKFILE_CONFIG_MISMATCH
      # ab. Konsistent zu ci.yml.
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # Standalone (ohne Workbench-Workspace) fehlen die node_modules/@panary/*-
      # Links → @nx/js:tsc (z. B. shared-backend) findet @panary/users/domain nicht.
      # Das Skript repliziert die Workspace-Links, damit Cross-Lib-Builds auflösen.
      - name: Link @panary/* packages (Standalone-Resolution)
        run: bash tools/scripts/link-core-packages.sh

      # Das Gate oben prueft die Manifeste, die der Scan findet — es waere also blind
      # fuer ein publishable Projekt, das er gar nicht kennt (kein eigenes project.json,
      # Manifest nicht daneben). Dieser Abgleich gegen die nx-Menge bricht die
      # Selbstbezueglichkeit auf und laeuft deshalb bei JEDEM Trigger, auch im Dry-Run.
      - name: Publishable-Menge gegen nx abgleichen
        run: |
          pnpm nx show projects --projects="tag:publishable" --json > /tmp/nx-publishable.json
          node tools/scripts/publishable-manifests.mjs --expect-projects-file /tmp/nx-publishable.json

      - name: Build publishable libraries
        run: pnpm nx run-many -t build --projects="tag:publishable"

      - name: Dry-Run Publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nx release publish --dry-run

      # Echtes Publishing: bei Tag-Push (v*) immer, bei manuellem Dispatch nur
      # wenn dry-run explizit auf 'false' steht.
      - name: Publish to GitHub Packages
        if: ${{ github.event_name == 'push' || inputs.dry-run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nx release publish
