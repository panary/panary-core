# --- Build-Scripts (pnpm 11+: allowBuilds, strictDepBuilds als Default) ----
# Nur better-sqlite3 baut (native Bindung fuer api-edge). Die uebrigen Pakete mit
# Install-Scripts sind ausdruecklich gesperrt, wie unter pnpm 10 ("Ignored build
# scripts"); ohne Eintrag bricht pnpm 11+ den Install ab.
allowBuilds:
  'better-sqlite3': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  'esbuild': false
  'lefthook': false
  'lmdb': false
  'msgpackr-extract': false
  'nx': false
  'unrs-resolver': false

# --- Kein Boot-Dokument im Lockfile (pnpm 11+) ------------------------------
# Ohne diesen Key schreibt pnpm 12 bei gesetztem `packageManager` ein
# zusaetzliches erstes YAML-Dokument (`packageManagerDependencies`, die
# @pnpm/exe.*-Binaries) vor das eigentliche Lockfile. osv-scanner 2.3.8 liest
# nur dieses erste Dokument: gemessen 16 statt 1768 Pakete — der Security-Scan
# waere still blind geworden (panary/panary-core#1535). Mit `ignore` bleibt das
# Lockfile byte-gleich zum pnpm-10-Stand. Preis: pnpm prueft und wechselt die
# eigene Version nicht mehr anhand von `packageManager`; den Pin setzen in der CI
# pnpm/action-setup (liest `packageManager`) und in Dockerfile.edge das
# `npm install -g pnpm@…`. Entfernen erst, wenn osv-scanner und Dependabot das
# Mehr-Dokument-Lockfile nachweislich vollstaendig lesen.
pmOnFail: ignore
