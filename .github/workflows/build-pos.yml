name: Build POS (Test-Artefakte)

on:
  workflow_dispatch:

# Least-privilege: Workflow liest nur Quellcode und laedt Artefakte hoch
# (upload-artifact braucht keine extra-Permissions). Kein Release-Push hier.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cloud-Pattern: keine `version:` setzen — die Action liest die pnpm-
      # Version aus dem `packageManager`-Feld der package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: apps/pos-client/src-tauri -> target

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Standalone-Resolution der @panary/*-Pakete: legt node_modules/@panary/*-
      # Symlinks zu den lokalen libs an (identisch zum CI-Workflow). Ohne diesen
      # Schritt findet `nx build pos-client` @panary/shared-common,
      # @panary/util-error-handling, @panary/users/domain etc. nicht (TS2307),
      # weil der nx-tsc-Executor die tsconfig-`paths` nicht honoriert.
      # MSYS=winsymlinks:nativestrict erzwingt native Windows-Symlinks statt
      # Datei-Kopien — zwingend, da die libs-`dist/` erst beim Build entstehen
      # und der Link eine Live-Referenz (keinen Snapshot) braucht.
      - name: Link @panary/* packages
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: bash tools/scripts/link-core-packages.sh

      - name: Build Angular POS
        run: pnpm nx build pos-client --configuration=production --parallel=1

      - name: Verify Angular Build
        shell: bash
        run: |
          if [ ! -d "dist/apps/pos-client/browser" ]; then
            echo "ERROR: Angular build output not found at dist/apps/pos-client/browser"
            exit 1
          fi
          echo "Angular build OK: $(ls dist/apps/pos-client/browser/ | wc -l) files"

      # Seit a85ef6c steht `bundle.createUpdaterArtifacts: true` in der
      # tauri.conf.json (Updater-Fix fuer Release pos-v26.7.14). Damit will
      # JEDER Tauri-Build die Updater-Artefakte signieren und bricht ohne
      # TAURI_SIGNING_PRIVATE_KEY ab. Dieser Workflow baut nur Test-Artefakte
      # ohne Release/Updater-Manifest — der Signing-Key bleibt bewusst dem
      # Release-Workflow vorbehalten (Least-Privilege), stattdessen wird das
      # Updater-Artefakt hier per Config-Override deaktiviert.
      # WICHTIG: Override als Datei statt Inline-JSON in `args` — tauri-action
      # parst `args` mit string-argv, das die JSON-Anfuehrungszeichen als
      # Quoting interpretiert und wegstrippt → invalides JSON beim Tauri-CLI.
      - name: Tauri-Config-Override (Updater-Artefakte deaktivieren)
        shell: bash
        run: printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > apps/pos-client/src-tauri/ci-no-updater.conf.json

      - name: Build Tauri (NSIS Installer)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/pos-client
          tauriScript: pnpm tauri
          # Absoluter Pfad zwingend: tauri-action fuehrt `pnpm tauri build`
          # mit CWD im Repo-Root aus (nicht in projectPath), und das Tauri-CLI
          # liest die --config-Datei beim Argument-Parsing relativ zum CWD.
          # Ein projectPath-relativer Pfad scheitert mit os error 3
          # (beobachtet in Run 28625013514).
          args: --config ${{ github.workspace }}/apps/pos-client/src-tauri/ci-no-updater.conf.json

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: panary-pos-client-windows
          path: |
            apps/pos-client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # macOS-Testartefakt (Apple Silicon). Bewusst hier und NICHT nur im
  # Release-Workflow: ein `pos-v*`-Tag ist ein Produktiv-Release, das alle
  # Windows-Kassen per Updater erreicht. Ein Testbuild fuer den Mac darf das
  # nicht ausloesen — deshalb laeuft er ueber workflow_dispatch von einem
  # beliebigen Branch, ohne Tag und ohne Versions-Bump.
  build-macos:
    runs-on: macos-latest
    # id-token: bitwarden/sm-action verlangt es (siehe release-pos.yml), sonst
    # startup_failure. Nur auf diesem Job, build-windows bleibt bei contents: read.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gleiche Signing-Kette wie release-macos (core#1229), damit ein Dispatch
      # vor dem pos-v*-Tag Developer-ID-Signatur und Notarisierung beweist. Den
      # Updater-Schluessel bekommt dieser Workflow weiterhin nicht (Least-
      # Privilege, siehe Windows-Job) — das .app.tar.gz zeigt erst das Release.
      - name: Apple-Signing eingerichtet?
        env:
          ID_CERTIFICATE: ${{ vars.BWS_ID_POS_APPLE_CERTIFICATE }}
          ID_CERTIFICATE_PASSWORD: ${{ vars.BWS_ID_POS_APPLE_CERTIFICATE_PASSWORD }}
          ID_SIGNING_IDENTITY: ${{ vars.BWS_ID_POS_APPLE_SIGNING_IDENTITY }}
          ID_APPLE_ID: ${{ vars.BWS_ID_POS_APPLE_ID }}
          ID_PASSWORD: ${{ vars.BWS_ID_POS_APPLE_PASSWORD }}
          ID_TEAM_ID: ${{ vars.BWS_ID_POS_APPLE_TEAM_ID }}
        run: |
          missing=()
          for v in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID PASSWORD TEAM_ID; do
            n="ID_$v"; [ -n "${!n}" ] || missing+=("BWS_ID_POS_APPLE_${v#APPLE_}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Apple-Signing nicht eingerichtet — Repo-Variablen fehlen: ${missing[*]}. Ohne Developer-ID-Signatur und Notarisierung wird kein macOS-Bundle gebaut (core#1229, docs/integrations/tauri-update-server-einrichtung.md)."
            exit 1
          fi

      - name: Bitwarden Secrets laden
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://tresor.ratke.info
          secrets: |
            ${{ vars.BWS_ID_POS_APPLE_CERTIFICATE }} > APPLE_CERTIFICATE
            ${{ vars.BWS_ID_POS_APPLE_CERTIFICATE_PASSWORD }} > APPLE_CERTIFICATE_PASSWORD
            ${{ vars.BWS_ID_POS_APPLE_SIGNING_IDENTITY }} > APPLE_SIGNING_IDENTITY
            ${{ vars.BWS_ID_POS_APPLE_ID }} > APPLE_ID
            ${{ vars.BWS_ID_POS_APPLE_PASSWORD }} > APPLE_PASSWORD
            ${{ vars.BWS_ID_POS_APPLE_TEAM_ID }} > APPLE_TEAM_ID

      - name: Signing-Secrets vollstaendig?
        run: |
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Leer aus Bitwarden: ${missing[*]} — Eintraege pruefen, kein unsignierter Build."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Target explizit gesetzt statt auf die Runner-Architektur zu vertrauen:
      # `macos-latest` zeigt heute auf Apple Silicon, das ist aber ein
      # bewegliches Ziel. Mit explizitem Target ist das Ergebnis deterministisch
      # (und der Bundle-Pfad traegt dann das Target-Triple, s. Upload-Step).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: apps/pos-client/src-tauri -> target

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Identisch zum Windows-Job, nur ohne MSYS-Env — native Symlinks sind
      # auf macOS der Normalfall.
      - name: Link @panary/* packages
        run: bash tools/scripts/link-core-packages.sh

      - name: Build Angular POS
        run: pnpm nx build pos-client --configuration=production --parallel=1

      - name: Verify Angular Build
        run: |
          if [ ! -d "dist/apps/pos-client/browser" ]; then
            echo "ERROR: Angular build output not found at dist/apps/pos-client/browser"
            exit 1
          fi
          echo "Angular build OK: $(ls dist/apps/pos-client/browser/ | wc -l) files"

      # Die committete tauri.macos.conf.json setzt createUpdaterArtifacts seit
      # core#1229 auf true; ohne Updater-Schluessel braeche der Build ab. Override
      # als Datei aus demselben Grund wie im Windows-Job (string-argv-Quoting).
      - name: Tauri-Config-Override (Updater-Artefakte deaktivieren)
        run: printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > apps/pos-client/src-tauri/ci-no-updater.conf.json

      - name: Build Tauri (macOS Bundle)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/pos-client
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin --config ${{ github.workspace }}/apps/pos-client/src-tauri/ci-no-updater.conf.json

      - name: Signatur und Notarisierung pruefen
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/pos-client/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          APP="${apps[0]:-}"
          [ -n "$APP" ] || { echo "ERROR: kein .app im Bundle gefunden"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Erst in eine Variable: grep -q in der Pipe beendet sich beim ersten Treffer,
          # codesign bekaeme unter pipefail SIGPIPE und der Step wuerde grundlos rot.
          details=$(codesign -dv --verbose=4 "$APP" 2>&1)
          grep -q '^Authority=Developer ID Application' <<<"$details" \
            || { echo "ERROR: $APP traegt keine Developer-ID-Signatur"; exit 1; }
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      # Nur das .dmg, nicht das .app: upload-artifact zippt ohne Executable-Bits
      # und ohne Symlinks — ein so uebertragenes .app-Bundle startet auf dem
      # Zielrechner nicht. Das Disk-Image uebersteht die Runde unbeschadet.
      - name: Upload macOS-Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: panary-pos-client-macos-aarch64
          path: |
            apps/pos-client/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
