# --- Befristet akzeptiert: chrono unmaintained (panary/panary-core#1497) -------
# RUSTSEC-2026-0543 (2026-09-14, "chrono is unmaintained", alle Versionen, keine
# gefixte Version) haelt den Scan auf main seit dem 2026-11-17 rot. Reine
# Unmaintained-Meldung, keine bekannte Schwachstelle.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"  # chrono 0.4.44 unmaintained
ignoreUntil = 2026-12-15
reason = "Kein Fix: alle chrono-Versionen betroffen, Alternativen jiff und time. Gemessen 2026-11-18: chrono steht nur als optionale Abhaengigkeit (Feature chrono_0_4) von serde_with 3.21.0 im Cargo.lock (einziger Parent, selbst nur ueber tauri-utils); aktiv sind dort allein alloc, default, macros und std (`cargo metadata --locked`), und `cargo tree -i chrono --locked --target all -e all` (auch mit --all-features) findet keinen Pfad vom POS-Crate. chrono wird also in keinem Ziel kompiliert und steckt in keinem ausgelieferten Artefakt. Ein Bump scheidet aus (keine Fix-Version), ein Entfernen aus dem Lockfile ebenso: Cargo fuehrt die optionalen Abhaengigkeiten eines Pakets dort mit. Eingetragen 2026-11-18 (panary/panary-core#1497, docs/security/osv-befund-2026-11-18-picomatch-chrono.md); Wiedervorlage zum Ablauf: pruefen, ob serde_with chrono nicht mehr als optionale Abhaengigkeit fuehrt oder chrono wieder gepflegt wird, dann Eintrag entfernen (der Scanner meldet ihn dann als unused)."

# --- Befristet akzeptiert: Fix noch unter Karenz (panary/panary-core#1519) -----
# Beide Fixes sind juenger als die 7-Tage-Karenz der Supply-Chain-Regel (fuer Cargo
# gilt sie ueber den Dependabot-Cooldown und per Absprache, nicht per Werkzeug):
# url 2.5.9 vom 2026-11-20 23:03 UTC (reif 2026-11-27), cookie 0.18.3 vom
# 2026-11-23 07:45 UTC (reif 2026-11-30). Danach per cargo update heben; der
# Scanner meldet die Eintraege dann als unused, und sie werden entfernt.
# Befund: docs/security/osv-befund-2026-11-24-url-cookie.md.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0592"  # url 2.5.8: Stack-Overflow in Url::origin() bei verschachtelten blob:-URLs (Alias GHSA-hrj5-67jp-wqp9)
ignoreUntil = 2026-12-07
reason = "Fix url 2.5.9 erst seit 2026-11-20 23:03 UTC, Karenz bis 2026-11-27. Gemessen 2026-11-24: Keiner der direkten url-Konsumenten im Cargo.lock (reqwest 0.13.4, tauri 2.12.1, tauri-runtime(-wry) 2.12.1, wry 0.57.0, tao 0.37.1, tauri-utils 2.10.1, tauri-codegen 2.7.1, tauri-plugin-opener 2.7.2, tauri-plugin-updater 2.14.1, tower-http 0.6.11, urlpattern 0.6.0, schemars) und auch nicht das POS-Crate selbst ruft Url::origin() oder url::quirks::origin() auf (grep ueber die Quellen aus cargo metadata). Der verwundbare Pfad ist im POS damit nicht erreichbar. Eingetragen 2026-11-24 (panary/panary-core#1519); nach der Reife per cargo update -p url --precise 2.5.9 heben und Eintrag entfernen."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0594"  # cookie 0.18.1: Nonce-Wiederholung privater Cookies nach fork() (Alias GHSA-8wcq-xq25-7fhm)
ignoreUntil = 2026-12-07
reason = "Fix cookie 0.18.3 erst seit 2026-11-23 07:45 UTC, Karenz bis 2026-11-30. Nicht betroffen: Die Schwachstelle sitzt im PrivateJar (Feature private), cookie 0.18.1 ist im POS ohne jedes Feature aufgeloest (cargo metadata --locked: features []), PrivateJar wird also nicht kompiliert. Parents sind tauri, tauri-runtime und wry; das POS forkt nicht und betreibt keinen Webserver. Eingetragen 2026-11-24 (panary/panary-core#1519); nach der Reife per cargo update -p cookie --precise 0.18.3 heben (nicht 0.19.0-rc.0) und Eintrag entfernen."
