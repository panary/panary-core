# OSV-Scanner: bewusst akzeptierte Advisories fuer das npm-Lockfile in DIESEM
# Verzeichnis (pnpm-lock.yaml). osv-scanner sucht seine Konfiguration nur im
# Verzeichnis des gescannten Manifests und vererbt sie NICHT an
# Unterverzeichnisse — die Cargo-Ausnahmen des Tauri-Stacks stehen deshalb
# weiterhin getrennt in apps/pos-client/src-tauri/osv-scanner.toml.
#
# Verlauf: docs/security/osv-befund-2026-08-07.md (image-size eingetragen),
# docs/security/osv-befund-2026-09-26.md (image-size entfernt).
# Pendant in panary-cloud/osv-scanner.toml — synchron halten.
#
# Gilt seit core#448 auch fuer die Advisory-Pruefung des Edge-Images
# (tools/scripts/osv-edge-advisories.sh: npm aus der Stueckliste, Debian aus dem
# Image). Ein Eintrag hier nimmt den Befund dort ebenfalls aus — Debian-IDs
# (DEBIAN-CVE-…) betreffen nur das Image.

# --- Befristet akzeptiert -----------------------------------------------------
# scripts/security-scan.mjs reicht diese Datei per --config an osv-scanner
# weiter, damit ein Eintrag fuer jedes gescannte Lockfile gilt — auch fuer die
# Temp-Kopie aus HEAD, die im Haupt-Checkout gescannt wird. `pnpm audit` kennt
# das Advisory unten nicht, ein Gegenstueck dort entfaellt.
# Verlauf: docs/security/osv-befund-2026-10-02-node-forge.md,
# docs/security/osv-befund-2026-10-03-braces-http-cache-semantics.md.

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"  # node-forge: RSA-PKCS#1-v1.5-Signaturpruefung akzeptiert verschachtelte DigestAlgorithm-Elemente (CVSS 8.7)
ignoreUntil = 2026-11-02
reason = "Kein Fix: betroffen ist <= 1.4.0, und 1.4.0 ist die neueste node-forge-Version. Nur Dev-Abhaengigkeit (@nx/angular -> @nx/rspack -> @rspack/dev-server@1.2.1 -> selfsigned@2.4.1), nicht im Edge-Image (pnpm prune --prod; pnpm why node-forge --prod ist leer). selfsigned erzeugt nur ein lokales Dev-Server-Zertifikat; die einzige Signaturpruefung (verifyCertificateChain) gilt dem eben selbst erzeugten Zertifikat, nie fremdem Input. Override selfsigned ^5 scheidet aus: v5 ist async-only, @rspack/dev-server ruft generate() synchron. Eingetragen 2026-10-02 (panary/panary-core#475, Pendant panary/panary-cloud#835); bei Fix-Version per Override heben und Eintrag entfernen."

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"  # braces: Stack-Exhaustion-DoS durch tief verschachtelte Muster (CVSS 8.7)
ignoreUntil = 2026-11-03
reason = "Kein Fix: betroffen ist <= 3.0.3, und 3.0.3 ist die neueste braces-Version. Nur Dev-Abhaengigkeit (chokidar/micromatch unter @nx/rspack, @nx/webpack, nodemon, shelljs), nicht im Edge-Image (pnpm why braces --prod ist leer, scan-advisories im Dispatch 37107902781 gruen). Die Muster stammen aus der eigenen Werkzeug-Konfiguration (Watcher, Globs), nie aus fremdem Input. Eingetragen 2026-10-03 (panary/panary-core#499, Pendant panary/panary-cloud#912); bei Fix-Version per Override heben und Eintrag entfernen."

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"  # http-cache-semantics: max-stale gibt gecachte Antworten anderer Nutzer preis (CVSS 8.7)
ignoreUntil = 2026-11-03
reason = "Kein Fix: betroffen ist <= 4.2.0, und 4.2.0 ist die neueste http-cache-semantics-Version. Nur Dev-Abhaengigkeit (make-fetch-happen unter pacote/@sigstore/sign/tuf-js, also Angular-CLI- und Sigstore-Paketabruf), nicht im Edge-Image (pnpm why http-cache-semantics --prod ist leer, scan-advisories im Dispatch 37107902781 gruen). make-fetch-happen cacht lokal fuer einen Nutzer; ein von mehreren Nutzern geteilter HTTP-Cache, den das Advisory voraussetzt, kommt nicht vor. Eingetragen 2026-10-03 (panary/panary-core#499, Pendant panary/panary-cloud#912); bei Fix-Version per Override heben und Eintrag entfernen."

[[IgnoredVulns]]
id = "GHSA-333x-w4r6-6crp"  # fast-uri: Scheme-Injection (CVSS 3.7)
ignoreUntil = 2026-11-02
reason = "Karenz, nicht fehlender Fix: Fix 3.1.9 ist seit 2026-10-19 23:05 UTC publiziert, die Supply-Chain-Karenz (minimumReleaseAge 10080) laesst sie erst ab 2026-10-26 23:05 UTC zu. PROD-Abhaengigkeit der Edge (pnpm why fast-uri --prod: ajv -> @feathersjs/schema -> authentication); ajv nutzt fast-uri zum Aufloesen von Schema-$id/$ref, nicht zur Verarbeitung von Request-URIs. Eingetragen 2026-10-25 (panary/panary-core#952, Pendant panary/panary-cloud#1450); nach Ablauf der Karenz fast-uri-Override auf ^3.1.9 heben und die vier Eintraege entfernen."

