<nav
  class="flex h-full w-[4.75rem] flex-col items-center gap-1.5 overflow-y-auto border-line bg-surface-rail py-3"
  [class.border-r]="staff.railSide() === 'left'"
  [class.border-l]="staff.railSide() === 'right'"
  [attr.aria-label]="'POS_NAV.LABEL' | translate"
>
  <lib-panary-logo class="mb-2.5" [size]="2.125" [wordmark]="false" />

  @for (item of nav.rail(); track item.entry.id) {
    <button
      type="button"
      class="rail-item"
      [class.is-active]="nav.isActive(item)"
      [class.is-blocked]="item.block"
      [disabled]="nav.locked()"
      [attr.aria-current]="nav.isActive(item) ? 'page' : null"
      [attr.aria-disabled]="item.block ? true : null"
      [title]="item.block ? (item.block | translate) : ''"
      (click)="nav.open(item)"
    >
      <lib-icon [name]="item.entry.icon" class="text-[1.5rem]" />
      <span>{{ item.entry.label | translate }}</span>
      @if (item.entry.id === 'open-orders' && nav.openOrdersCount() > 0) {
        <span
          class="absolute right-1.5 top-1 grid h-[1.125rem] min-w-[1.125rem] place-items-center rounded-pill bg-danger-ink px-1 text-[0.6875rem] font-bold leading-none text-white tabular-nums"
          [attr.aria-label]="'POS_NAV.OPEN_COUNT' | translate: { count: nav.openOrdersCount() }"
          >{{ nav.openOrdersCount() }}</span
        >
      }
    </button>
  }

  <button
    type="button"
    class="rail-item"
    [class.is-active]="nav.moreActive()"
    [disabled]="nav.locked()"
    [cdkMenuTriggerFor]="moreMenu"
    [cdkMenuPosition]="menuPositions()"
  >
    <lib-icon name="dots-three" class="text-[1.5rem]" />
    <span>{{ 'POS_NAV.MORE' | translate }}</span>
  </button>

  <span class="flex-1"></span>

  <!-- Fußzone (core#942): Stempeltaste, Abmelden, ganz unten der Avatar mit Online-Punkt — nur Icons. -->
  <lib-pos-time-clock [locked]="nav.locked()" [railSide]="staff.railSide()" [menuPositions]="menuPositions()" />

  <!-- Offline gesperrt mit Hinweis: bleibt antippbar, PosStaffService.logout() meldet den Grund. -->
  <button
    type="button"
    class="rail-item rail-item--compact"
    data-tone="danger"
    [class.is-blocked]="staff.isOffline()"
    [disabled]="nav.locked()"
    [attr.aria-disabled]="staff.isOffline() ? true : null"
    [attr.aria-label]="'DASHBOARD.LOGOUT' | translate"
    [title]="(staff.isOffline() ? 'DASHBOARD.LOGOUT_OFFLINE_BLOCKED' : 'DASHBOARD.LOGOUT') | translate"
    (click)="staff.logout()"
  >
    <lib-icon name="lock" class="text-[1.5rem]" />
  </button>

  <!-- Live-Region bleibt stehen, nur der Text wechselt: eine neu entstehende Region sagen Screenreader oft nicht an. -->
  <span class="text-xs font-semibold text-danger-ink empty:hidden" role="status">{{
    staff.isOffline() ? ('POS_NAV.OFFLINE' | translate) : ''
  }}</span>
  <button
    type="button"
    class="relative mt-1 grid h-11 w-11 shrink-0 place-items-center rounded-full bg-ink text-[0.9375rem] font-bold text-surface-panel disabled:opacity-40"
    [disabled]="nav.locked()"
    [attr.aria-label]="(staff.isOffline() ? 'POS_NAV.ACCOUNT_OFFLINE' : 'POS_NAV.ACCOUNT_ONLINE') | translate"
    [cdkMenuTriggerFor]="accountMenu"
    [cdkMenuPosition]="accountMenuPositions()"
  >
    {{ staff.initials() }}
    <i
      class="absolute -bottom-0.5 -right-0.5 h-3.5 w-3.5 rounded-full border-2 border-surface-rail"
      [class.bg-action]="!staff.isOffline()"
      [class.bg-danger]="staff.isOffline()"
      aria-hidden="true"
    ></i>
  </button>
</nav>

<ng-template #moreMenu>
  <div cdkMenu class="pos-menu w-[21.25rem]">
    @for (group of nav.moreGroups(); track group.id) {
      <div class="pos-menu__label">{{ group.label | translate }}</div>
      @for (item of group.items; track item.entry.id) {
        <button
          cdkMenuItem
          type="button"
          class="pos-menu__item"
          [class.is-active]="nav.isActive(item)"
          [class.is-blocked]="item.block"
          [attr.aria-disabled]="item.block ? true : null"
          (cdkMenuItemTriggered)="nav.open(item)"
        >
          <lib-icon [name]="item.entry.icon" class="text-[1.375rem]" />
          <span class="flex min-w-0 flex-col">
            {{ item.entry.label | translate }}
            @if (item.block) {
              <em class="text-xs font-medium not-italic text-ink-muted">{{ item.block | translate }}</em>
            }
          </span>
        </button>
      }
    }
    <div class="pos-menu__label">{{ 'POS_NAV.GROUP_DEVICE' | translate }}</div>
    <button
      cdkMenuItem
      type="button"
      class="pos-menu__item"
      [class.is-active]="nav.isActive(nav.settings())"
      (cdkMenuItemTriggered)="nav.open(nav.settings())"
    >
      <lib-icon name="gear" class="text-[1.375rem]" />
      <span class="flex-1">{{ 'DASHBOARD.SETTINGS' | translate }}</span>
    </button>
  </div>
</ng-template>

<ng-template #accountMenu>
  <div cdkMenu class="pos-menu w-[23.75rem]">
    <lib-pos-account-panel />
  </div>
</ng-template>
