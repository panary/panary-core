name: Release POS

on:
  push:
    tags: ['pos-v*']
  workflow_dispatch:

permissions:
  contents: write
  # bitwarden/sm-action verlangt id-token: write (OIDC-Auth gegen den
  # self-hosted Vault). Ohne diese Permission lehnt GitHub den Workflow
  # vor der Job-Allokation ab → startup_failure (Run-Start ≈ Run-Ende,
  # keine Jobs, keine Logs). Beobachtet bei pos-v26.6.1.
  id-token: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0 (Node24-Runtime). Zuvor war @v2 (Node20)
      # gepinnt, weil v3 bei pos-v26.6.1 einen startup_failure verursachte
      # (Node24 auf GitHub-Runnern damals noch nicht GA). Mit der Node-24-
      # Erzwingung ab 2026-06-16 läuft node20 ohnehin nicht mehr → v3 ist der
      # einzige tragfähige Pfad. WICHTIG: exakt @v3.0.0, NICHT @v3 — bitwarden
      # pflegt für v3 (anders als v1/v2) KEIN bewegliches Major-Tag, nur die
      # konkreten Releases; @v3 schlägt mit "unable to find version v3" fehl
      # (beobachtet bei pos-v26.7.9).
      - name: Bitwarden Secrets laden
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://tresor.ratke.info
          secrets: |
            dd793c0b-6aa8-4b66-98e8-b41a0188f86b > TAURI_SIGNING_PRIVATE_KEY
            ba98581b-4221-40ac-907c-b41a0189001d > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      # Cloud-Pattern: keine `version:` setzen — die Action liest die
      # autoritative pnpm-Version aus dem `packageManager`-Feld der
      # package.json. Beide gleichzeitig kollidieren mit ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/pos-client/src-tauri -> target

      # CI-Build-Kontext-Vorbereitung (Windows-PowerShell):
      # 1. Das Repo bringt eine `pnpm-workspace.yaml` mit, die NUR die
      #    Supply-Chain-Settings traegt (kein `packages:`-Key). Die
      #    Workspace-Globs werden hier ANGEHAENGT, nicht drueber geschrieben —
      #    sonst gingen minimumReleaseAge/trustPolicy/blockExoticSubdeps
      #    still verloren.
      # 2. pnpm-lock.yaml ist ein Symlink ins Workbench-Root → bricht in CI.
      #    Loeschen + mit --lockfile-only neu materialisieren.
      - name: Workspace-Files fuer CI-Kontext materialisieren
        shell: pwsh
        run: |
          if (Test-Path pnpm-lock.yaml) { Remove-Item -Force pnpm-lock.yaml }
          # Sicherung: committete Datei muss da sein und darf die angehaengten
          # Keys noch nicht tragen (YAML verbietet Duplikate).
          if (-not (Test-Path pnpm-workspace.yaml)) {
            Write-Error "pnpm-workspace.yaml fehlt im Repo"; exit 1
          }
          if (Select-String -Path pnpm-workspace.yaml -Pattern '^(packages|onlyBuiltDependencies):' -Quiet) {
            Write-Error "pnpm-workspace.yaml traegt bereits packages:/onlyBuiltDependencies: — dieser Step wuerde doppelte YAML-Keys erzeugen. Step und Repo-Datei abgleichen."
            exit 1
          }
          @"

          # --- vom CI angehaengt (release-pos.yml) ---
          packages:
            - 'apps/*'
            - 'libs/domains/*'
            # libs/shared selbst ist das @panary/shared-Parent-Paket (Option A);
            # ohne diesen Eintrag ist es kein Workspace-Member und pnpm versucht,
            # @panary/shared (Peer der Domain-Parents, vom pos-client genutzt)
            # aus der Registry zu fetchen → FETCH_401 (so bei pos-v26.7.9).
            # Analog zu build-edge-docker.yml.
            - 'libs/shared'
            - 'libs/shared/*'
          onlyBuiltDependencies:
            - '@swc/core'
            - 'better-sqlite3'
            - 'esbuild'
            - 'nx'
          "@ | Out-File -Append -Encoding utf8 pnpm-workspace.yaml
          # .npmrc fuer Workspace-Linking — sonst zieht pnpm @panary/*
          # aus npm.pkg.github.com (ERR_PNPM_FETCH_401 ohne Auth-Token).
          @"
          link-workspace-packages=deep
          prefer-workspace-packages=true
          auto-install-peers=true
          strict-peer-dependencies=false
          "@ | Out-File -Encoding utf8 .npmrc
          # Anders als build-edge-docker.yml wird das Lockfile hier UNBEDINGT
          # geloescht → vollstaendige Neuaufloesung. Dabei darf pnpm frei auf
          # reife Versionen ausweichen, die 7-Tage-Karenz aus
          # pnpm-workspace.yaml bleibt also aktiv (verifiziert 2026-07-22).
          # Bricht ein Release mit ERR_PNPM_NO_MATURE_MATCHING_VERSION ab, zeigt
          # ein `pnpm.overrides`-Eintrag in package.json auf eine Version, die
          # juenger als 7 Tage ist → Paket befristet in
          # `minimumReleaseAgeExclude` aufnehmen (siehe
          # docs/adr/0012-pnpm-supply-chain-haertung.md).
          pnpm install --lockfile-only

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # Standalone-Resolution der @panary/*-Pakete (siehe build-pos.yml):
      # node_modules/@panary/*-Symlinks zu den lokalen libs, sonst TS2307 beim
      # `nx build pos-client`. Native Windows-Symlinks via MSYS erzwingen.
      - name: Link @panary/* packages
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: bash tools/scripts/link-core-packages.sh

      - name: Build Angular POS
        run: pnpm nx build pos-client --configuration=production --parallel=1

      - name: Verify Angular Build
        shell: bash
        run: |
          if [ ! -d "dist/apps/pos-client/browser" ]; then
            echo "ERROR: Angular build output not found at dist/apps/pos-client/browser"
            exit 1
          fi
          echo "Angular build OK: $(ls dist/apps/pos-client/browser/ | wc -l) files"

      - name: Build Tauri & Create Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/pos-client
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Panary POS ${{ github.ref_name }}'
          releaseBody: 'Neues Release der Panary POS App. Siehe Changelog für Details.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # tauri-action (gepinnte v0) laedt das Updater-Manifest bei Tauri-v2-NSIS
      # NICHT hoch ("Signature not found for the updater JSON. Skipping upload...")
      # — obwohl die .sig erzeugt und angehaengt wird. Ohne latest.json laeuft der
      # Client-Update-Check (releases/latest/download/latest.json) in einen 404,
      # der still im UpdateService-catch verschluckt wird → kein Auto-Update.
      # Deshalb das Manifest hier deterministisch selbst bauen und anhaengen.
      # Asset-Name wird aus dem tatsaechlich hochgeladenen Release-Asset gelesen
      # (GitHub normalisiert Leerzeichen/Em-Dash zu Punkten — nicht rekonstruierbar).
      - name: Updater-Manifest (latest.json) erzeugen und anhaengen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#pos-v}"

          shopt -s nullglob
          sigs=(apps/pos-client/src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
          SIG_PATH="${sigs[0]:-}"
          [ -n "$SIG_PATH" ] || { echo "ERROR: keine NSIS-.sig im Bundle gefunden"; exit 1; }

          # jq.exe ist ein natives Win32-Binary und dekodiert argv in der ANSI-Codepage —
          # der Gedankenstrich im productName ("Panary — Terminal") bricht dort den Pfad
          # ("Could not open …sig", beobachtet bei pos-v26.7.16). Die Signatur deshalb
          # per MSYS-cp auf einen ASCII-Pfad kopieren und jq nur diesen Namen geben.
          cp "$SIG_PATH" updater.sig

          ASSET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name | endswith("-setup.exe")) | .name' | head -1)
          [ -n "$ASSET" ] || { echo "ERROR: kein -setup.exe-Asset am Release"; exit 1; }
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n --rawfile sig updater.sig --arg ver "$VERSION" --arg url "$URL" --arg date "$PUBDATE" \
            '{version:$ver, notes:"Panary POS Update", pub_date:$date, platforms:{"windows-x86_64":{signature:$sig, url:$url}}}' \
            > latest.json
          echo "--- latest.json ---"; cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # macOS-Bundle (Apple Silicon) an dasselbe Release haengen.
  #
  # `needs: release-windows` ist bewusst gesetzt und nicht nur Reihenfolge-
  # Kosmetik: das GitHub-Release wird von tauri-action im Windows-Job angelegt.
  # Liefe dieser Job parallel, wuerden zwei Jobs gleichzeitig dasselbe Release
  # erzeugen wollen. Hier wird deshalb nur noch angehaengt (gh release upload).
  #
  # Kein Updater-Pfad: die committete tauri.macos.conf.json setzt
  # createUpdaterArtifacts auf false, das Manifest latest.json bleibt
  # Windows-only. Der Update-Check der App faengt den fehlenden
  # darwin-aarch64-Key im try/catch ab (UpdateService) — das macOS-Bundle wird
  # also manuell aktualisiert, bis der Apple-Signing-Pfad steht.
  release-macos:
    needs: release-windows
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/pos-client/src-tauri -> target

      # ACHTUNG: inhaltsgleich zum pwsh-Step im Job release-windows oben.
      # Bewusst dupliziert statt in ein gemeinsames Skript extrahiert — der
      # Windows-Release-Pfad ist historisch fragil (Em-Dash im productName,
      # --config-Pfadaufloesung, Symlink-Lockfile, Bitwarden-Tag-Pinning) und
      # darf durch die macOS-Erweiterung nicht beruehrbar sein.
      # Wer hier etwas aendert, aendert es oben mit.
      - name: Workspace-Files fuer CI-Kontext materialisieren
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "pnpm-workspace.yaml fehlt im Repo"; exit 1
          fi
          if grep -qE '^(packages|onlyBuiltDependencies):' pnpm-workspace.yaml; then
            echo "pnpm-workspace.yaml traegt bereits packages:/onlyBuiltDependencies: — dieser Step wuerde doppelte YAML-Keys erzeugen. Step und Repo-Datei abgleichen."
            exit 1
          fi
          cat >> pnpm-workspace.yaml <<'YAML'

          # --- vom CI angehaengt (release-pos.yml, Job release-macos) ---
          packages:
            - 'apps/*'
            - 'libs/domains/*'
            - 'libs/shared'
            - 'libs/shared/*'
          onlyBuiltDependencies:
            - '@swc/core'
            - 'better-sqlite3'
            - 'esbuild'
            - 'nx'
          YAML
          cat > .npmrc <<'NPMRC'
          link-workspace-packages=deep
          prefer-workspace-packages=true
          auto-install-peers=true
          strict-peer-dependencies=false
          NPMRC
          pnpm install --lockfile-only

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Link @panary/* packages
        run: bash tools/scripts/link-core-packages.sh

      - name: Build Angular POS
        run: pnpm nx build pos-client --configuration=production --parallel=1

      - name: Verify Angular Build
        run: |
          if [ ! -d "dist/apps/pos-client/browser" ]; then
            echo "ERROR: Angular build output not found at dist/apps/pos-client/browser"
            exit 1
          fi
          echo "Angular build OK: $(ls dist/apps/pos-client/browser/ | wc -l) files"

      # Ohne tauri-action: das Release existiert dank `needs` bereits, es fehlt
      # nur noch das Artefakt. Ein zweiter tauri-action-Lauf wuerde hier nur
      # Release-Verwaltung duplizieren.
      # cd zwingend: das Tauri-CLI sucht src-tauri relativ zum CWD, und das
      # ist bei `run:` das Repo-Root (deshalb macht auch das npm-Skript
      # `tauri:build` diesen Wechsel).
      - name: Build Tauri (macOS Bundle)
        run: cd apps/pos-client && pnpm tauri build --target aarch64-apple-darwin

      - name: DMG an Release anhaengen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          shopt -s nullglob
          dmgs=(apps/pos-client/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          DMG_PATH="${dmgs[0]:-}"
          [ -n "$DMG_PATH" ] || { echo "ERROR: kein .dmg im Bundle gefunden"; exit 1; }

          echo "Haenge an: $DMG_PATH"
          gh release upload "$TAG" "$DMG_PATH" --repo "$GITHUB_REPOSITORY" --clobber
