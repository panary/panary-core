# --- Befristet akzeptiert: zip 4.6.1 (panary/panary-core#740) -------------------
# Fix erst in zip 9.0.0. Einziger Parent tauri-plugin-updater verlangt bis zur
# neuesten 2.x (2.14.0) strikt zip ^4; die Plugin-3.0-Reihe ist Alpha.
# Plattform: zip ist laut Plugin-Manifest nur für target_os = "windows" eingebunden
# (macOS/Linux nutzen tar + flate2). build-pos.yml baut Windows (NSIS) und macOS.
# Exposure: Der Updater prüft die Minisign-Signatur des Downloads vor jedem
# Entpacken; ein manipuliertes Archiv braucht den privaten Signierschlüssel.
# createUpdaterArtifacts = true (nicht "v1Compatible") liefert unter Windows die
# NSIS-.exe selbst aus, der zip-Entpackpfad wird für unsere Artefakte nicht genommen.
# Eingetragen 2026-10-18 (panary/panary-core#744), Ablauf höchstens 60 Tage.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"  # zip: SUID/SGID-Bits bleiben beim Entpacken erhalten
ignoreUntil = 2026-12-15
reason = "Fix zip 9.0.0; tauri-plugin-updater 2.14.0 (neueste 2.x) verlangt zip ^4. Nur Windows-Pfad, Entpacken erst nach Signaturprüfung, unsere NSIS-Artefakte sind nicht gezippt. Re-evaluieren mit Updater-Plugin ≥ 3 stabil (panary/panary-core#740)."

