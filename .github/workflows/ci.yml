name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manueller Cache-Test-Trigger (gh workflow run / Actions-UI „Run workflow"):
  # baut bei Dispatch ALLE Projekte (nx run-many) statt nur affected → der
  # Remote-Cache wird garantiert beschrieben/gelesen (affected ist bei Re-Runs
  # oft leer → kein Cache-Zugriff).
  workflow_dispatch:

# Nur PR-Laeufe zusammenfassen: ein neuer Push auf denselben PR bricht den noch
# laufenden Lauf ab. Die Git-Disziplin verlangt "Commit nach jeder abgeschlossenen
# Einheit" — ohne diese Gruppe lief jeder Zwischenstand bis zum Ende durch, obwohl
# sein Ergebnis niemanden mehr interessiert.
# Push-auf-main und Dispatch bekommen ueber github.sha eine eigene Gruppe und werden
# NIE abgebrochen: Dort schreibt der Nx-Remote-Cache mit dem RW-Token (siehe env
# unten), ein abgebrochener main-Lauf hinterliesse einen halb gefuellten Cache. Auf
# PRs kann das nicht passieren — die bekommen hoechstens den RO-Token.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Gemessene Laufzeit 4-11 min. Ohne diese Zeile greift der GitHub-Default von
    # SECHS Stunden — als einziger Workflow des Repos hatte ausgerechnet die PR-CI
    # keinen Deckel (build-edge-docker 45, build-pos/release-pos je 60).
    timeout-minutes: 30
    env:
      # --- Nx Self-Hosted Remote Cache (P6, 2026-06-18) ---
      # Aktiviert sich automatisch, sobald die Repo-Secrets gesetzt sind; vorher
      # leer → Nx ignoriert den Remote-Cache (No-op, kein CI-Bruch). Server-Deploy
      # + Runbook: docs/infrastructure/nx-remote-cache.md
      #
      # Poisoning-Schutz (CVE-2025-36852/CREEP): nur vertrauenswuerdige main-Pushes
      # bekommen den Read-Write-Token (befuellen den Cache). PRs bekommen hoechstens
      # den Read-Only-Token; ohne RO-Token bleibt der Server fuer PRs ungesetzt →
      # reiner lokaler Cache, kein Remote-Schreibzugriff aus einem PR.
      # (secrets.X != '' im env-Wert ist erlaubt — gleiches Muster wie HAS_NX_CLOUD.)
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || secrets.NX_CACHE_RO_TOKEN != '') && secrets.NX_CACHE_SERVER_URL || '' }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: tree:0
          fetch-depth: 0

      # Cloud-Pattern: keine `version:` setzen — die Action liest die pnpm-
      # Version aus dem `packageManager`-Feld der package.json. Beide
      # gleichzeitig kollidieren mit ERR_PNPM_BAD_PM_VERSION (CI #187).
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Bestimmt NX_BASE/NX_HEAD robust (Push: letzter erfolgreicher Run,
      # Fallback HEAD~1; PR: merge-base). Verhindert, dass `affected` ohne Base
      # alle ~100 Projekte baut (Runner-OOM / Exit 130). Braucht fetch-depth: 0.
      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      # `--no-frozen-lockfile`, weil das committete pnpm-lock.yaml im Workbench-
      # Setup ein Snapshot des geteilten Root-Lockfiles ist (Symlink + skip-worktree,
      # siehe panary-cloud/ci.yml). Dessen `overrides` sind die Vereinigung beider
      # Repos und matchen den Standalone-package.json-overrides hier nicht — frozen
      # würde mit ERR_PNPM_LOCKFILE_CONFIG_MISMATCH abbrechen. Konsistent zu panary-cloud.
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # Standalone (ohne Workbench-Workspace) fehlen die node_modules/@panary/*-
      # Links → @nx/js:tsc (z. B. shared-backend) findet @panary/users/domain nicht.
      - name: Link @panary/* packages (Standalone-Resolution)
        run: bash tools/scripts/link-core-packages.sh

      # `--all`, nicht `--base`: Ein `format:check --base=…` prüft ausschließlich
      # Dateien, die gegen main geändert wurden — auf main selbst also nie. Drift
      # wächst dort unbemerkt und schlägt erst zu, wenn jemand eine Datei aus
      # fremdem Grund anfasst; dann bricht sein PR an fremder Schuld ab (belegt in
      # panary-cloud #95: alle 21 beanstandeten Dateien waren schon vorher nicht
      # konform). Bewusst OHNE Baseline — anders als beim Typecheck ist der Bestand
      # hier mit einem Befehl behebbar, eine Baseline würde ihn nur konservieren.
      # Begründung: docs/adr/0022-format-gate-ohne-base.md
      - name: Format-Gate (workspace-weit)
        run: pnpm nx format:check --all

      # Der Wiki-Log liegt seit #137 als Fragmente in docs/log.d/ — `--check` faengt
      # falsch benannte, leere oder header-lose Fragmente ab, bevor sie auf main
      # landen. Der Spec laeuft mit, weil ein Gate, dessen Test nie laeuft, der Fall
      # "sieht gruen aus, ist es aber nicht" ist.
      - name: Wiki-Log-Fragmente pruefen
        run: |
          node scripts/docs-log.spec.mjs
          pnpm docs:log:check

      # Gleiche Konfliktklasse eine Ebene weiter: Die ADR-Liste in docs/adr/index.md
      # war die eine Zeile, die jeder ADR-PR am selben Ort anhaengte. Sie ist seit
      # #161 ein Generat (`pnpm docs:adr:index`) — der Check haelt Dateinamen,
      # Frontmatter-Pflichtfelder und doppelte Nummern fest und schlaegt an, wenn die
      # Liste in index.md nachwaechst. Begruendung: docs/adr/0025-adr-index-generiert-statt-gepflegt.md
      - name: ADR-Index und -Nummern pruefen
        run: |
          node scripts/docs-adr-index.spec.mjs
          pnpm docs:adr:index:check

      # bump-version.mjs laeuft nur beim Release — also genau dann, wenn ein
      # Fehler am teuersten ist und niemand mehr hinsieht. Bei v26.8.10 schrieb
      # es tauri.conf.json ueber einen JSON-Round-Trip zurueck und formatierte
      # dabei ~20 Zeilen um; aufgefallen ist das nur, weil jemand die Gegenprobe
      # "der Release-Commit enthaelt ausschliesslich Versionszeilen" von Hand
      # gefahren hat. Der Spec haelt beides fest: Formatierung bleibt, und ein
      # fehlender Versionsschluessel bricht ab statt still durchzulaufen.
      - name: Release-Werkzeug pruefen
        run: pnpm release:verify

      # Seit #159 hat jedes Projekt mit eigenem Code ein `test`-Target — 45 der 86
      # davon ohne eine einzige Spec. Das war Absicht (ohne Target laeuft eine
      # spaeter angelegte Spec still ins Leere, #155), erzeugt aber genau die
      # Sorte Problem, gegen die auch das Typecheck-Gate gebaut wurde: In der
      # CI-Ausgabe ist ein leeres Target von einem vollen nicht zu unterscheiden,
      # beide melden gruen. Dieses Gate friert die LISTE der leeren Projekte ein
      # und bricht ab, sobald ein weiteres dazukommt; ein Projekt, das seine erste
      # Spec bekommt, bricht nicht ab. Details und Pflege:
      # scripts/empty-test-targets.mjs.
      #
      # Der Spec laeuft davor — ein Gate, dessen Test nie laeuft, ist derselbe
      # Fall "sieht gruen aus, ist es aber nicht", den es verhindern soll.
      - name: Leerstand der test-Targets pruefen
        run: |
          node scripts/empty-test-targets.spec.mjs
          pnpm empty-targets:gate

      # nx affected liest NX_BASE/NX_HEAD aus der Umgebung (nx-set-shas oben).
      #
      # `typecheck` ist seit 2026-08-06 dabei und bewusst HART, ohne Baseline: der
      # Workspace ist grün (83 Projekte, 0 Fehler). Bis dahin lief das Target
      # workspace-weit ins Leere — `tsc --build --emitDeclarationOnly` starb an
      # TS5069 in den spec-tsconfigs, bevor eine einzige Datei geprüft wurde (#110).
      # In der Zeit sind unbemerkt 96 Typfehler aufgelaufen (#111). Genau deshalb
      # steht das Gate hier: ohne Gate wächst so etwas still weiter.
      #
      # panary-cloud fährt dieselbe Absicht mit einem Baseline-Gate, weil dort 334
      # vorbestehende Fehler liegen. Hier wäre eine Baseline nur Maschinerie ohne
      # Inhalt — und ein hartes Gate ist das stärkere Versprechen.
      - name: Lint, Test, Typecheck & Build (affected)
        shell: bash
        run: |
          # Remote-Cache-Resilienz: bricht der Lauf wegen eines Remote-Cache-
          # Fehlers ab (Server 5xx/unreachable/Token), wird EINMAL ohne Remote-
          # Cache wiederholt (Fallback auf lokalen Cache), statt die CI hart
          # fehlschlagen zu lassen — Runbook-Absicht "Cache ist optionaler
          # Beschleuniger" (docs/infrastructure/nx-remote-cache.md). Echte Lint/Test/
          # Build-Fehler (kein Cache-Bezug) brechen weiterhin sofort ab.
          set -o pipefail
          run_affected() {
            if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
              pnpm nx run-many -t lint   # Cache-Test: alle Projekte → Remote-Cache
            else
              pnpm nx affected -t lint,test,typecheck,build
            fi
          }
          log="$(mktemp)"
          if run_affected 2>&1 | tee "$log"; then
            exit 0
          fi
          if [ -n "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}" ] && grep -qiE 'remote cache' "$log"; then
            echo "::warning title=Nx Remote-Cache::Remote-Cache nicht nutzbar — Retry ohne Remote-Cache (Fallback auf lokalen Cache)."
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER='' NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN='' run_affected
            exit $?
          fi
          exit 1
