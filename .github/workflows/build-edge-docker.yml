name: Build Edge Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    # Historisch lief der Edge-Build am 30-min-Cap (cache-los + QEMU-arm64,
    # ~50% cancelled). Seit 2026-06-18: nur noch linux/amd64 + GHA-Layer-Cache
    # → deutlich darunter. 45 bleibt grosszuegiger Headroom (Cap, kein Ziel);
    # nach Beobachtung realer amd64-Zeiten ggf. senken.
    timeout-minutes: 45

    # Fuer den Release-Job (Stueckliste als Asset am v*-Release).
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      # Fuer den Advisory-Job: scannt genau das gepushte Image, nicht einen Tag.
      digest: ${{ steps.docker_build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      # OIDC-Token fuer keyless cosign (Fulcio/Rekor) + Build-Provenance-Attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Hinweis: Der QEMU-Setup-Step (docker/setup-qemu-action) wurde am
      # 2026-06-18 entfernt — er wird nur fuer die arm64-Emulation gebraucht,
      # und der Edge baut jetzt nur linux/amd64. Re-Aktivierung: siehe Kommentar
      # am `platforms:`-Feld im Build-Step + docs/adr/0009-edge-build-platforms.md.

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version Tag
        id: version
        run: |
          # github-Kontext NICHT direkt interpolieren (Shell-Injection-Risiko,
          # semgrep run-shell-injection) — die Runner-ENV $GITHUB_REF nutzen.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag-Push: Version direkt aus dem Tag lesen (v26.4.1 → 26.4.1)
            echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch: NIEMALS die package.json-Version verwenden.
            # Die zeigt auf das zuletzt veroeffentlichte Release — ein Testbuild
            # vom Branch wuerde damit ein bereits ausgeliefertes Image
            # ueberschreiben, und wer diese Version pullt, bekaeme etwas
            # anderes als das, was unter ihr released wurde.
            echo "tag=staging-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # Workspace-Nachbau (pnpm-workspace.yaml-Globs, .npmrc, echte Lockfile,
      # .dockerignore) — Begruendung im Skript. Dasselbe Skript faehrt die
      # PR-Pruefung edge-image-check.yml (panary/panary-core#497).
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js (fuer pnpm install --lockfile-only)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Workspace-Files fuer Docker-Kontext materialisieren
        run: bash tools/docker/prepare-edge-context.sh

      # --- Smoke-Test VOR dem Push (#508) ---
      # Der Push bewegt bei einem v*-Tag `:latest`, und Watchtower rollt das
      # binnen einer Stunde auf jeden Kunden-Edge aus. Deshalb wird genau dieser
      # Stand erst gebaut, in den lokalen Docker geladen und gestartet. Der
      # Push-Schritt danach baut aus demselben Builder-Cache (keine zweite
      # Kompilierung) und pusht per Buildx, weil Signatur und Provenance an
      # dessen Digest haengen; der Digest kann deshalb abweichen, die Layer nicht.
      # Dieselbe Pruefung wie im PR (edge-image-check.yml).
      - name: Build fuer Smoke-Test (laden, ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: tools/docker/Dockerfile.edge
          platforms: linux/amd64
          load: true
          tags: panary-edge:release-check
          build-args: |
            PANARY_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha

      - name: Smoke-Test (Container starten, /health pruefen)
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.tag }}
        run: bash tools/docker/smoke-edge-image.sh panary-edge:release-check "$EXPECTED_VERSION"

      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: tools/docker/Dockerfile.edge
          # 2026-06-18: arm64 entfernt — der Edge laeuft beim Testkunden auf einem
          # amd64-Linux-Server; das api-edge-Image wird nirgends auf ARM deployt
          # (die Sunmi-Geraete fahren den pos-client/Frontend, nicht dieses Image).
          # Das QEMU-emulierte arm64-Cross-Build war der groesste Zeitfresser.
          #
          # >>> Re-Aktivierung von arm64 (z.B. ARM-SBC als Edge) — exakt: <<<
          #   1. Diese Zeile zuruecksetzen auf:
          #        platforms: linux/amd64,linux/arm64
          #   2. Den QEMU-Setup-Step wieder VOR dem "Login to GHCR"-Step einfuegen
          #      (registriert die binfmt-Handler fuer die Emulation):
          #        - name: Set up QEMU (Multi-Platform)
          #          uses: docker/setup-qemu-action@v4
          # Alternative ohne QEMU-Emulation (schneller): arm64 nativ auf einem
          # ARM-Runner (runs-on: ubuntu-24.04-arm) bauen und per
          # `docker buildx imagetools create` zur Multi-Arch-Manifest-Liste mergen.
          # Volle Begruendung: docs/adr/0009-edge-build-platforms.md
          platforms: linux/amd64
          push: true
          # App-Version ins Image injizieren — /health meldet damit den Image-Tag
          build-args: |
            PANARY_VERSION=${{ steps.version.outputs.tag }}
          # `:latest` NUR bei einem echten v*-Tag-Push. Jeder installierte Edge
          # laeuft auf `${PANARY_TAG:-latest}` mit Watchtower im Stundentakt
          # (tools/hosting/get.panary.cloud/install.sh) — dieser Tag zu bewegen
          # ist ein automatischer Rollout auf ALLE Kunden, kein Build.
          # Ein workflow_dispatch vom Branch liefert deshalb ausschliesslich
          # `staging-<sha>`; darauf kann ein einzelner Test-Edge gezielt
          # gepinnt werden, ohne alle anderen mitzuziehen.
          tags: |
            ghcr.io/${{ github.repository_owner }}/panary-edge:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.is_release == 'true' && format('ghcr.io/{0}/panary-edge:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          # cache-to fehlte → der gha-Cache wurde nie geschrieben, cache-from lief
          # permanent ins Leere. mode=max cached auch die teuren Zwischen-Layer
          # (better-sqlite3 unter QEMU-arm64 + die drei Angular-Production-Builds).
          cache-to: type=gha,mode=max

      # --- Supply-Chain-Herkunft des OFFIZIELLEN Edge-Images ---
      # Wichtig (Scope-Ehrlichkeit): cosign/SLSA beweisen die HERKUNFT des Images
      # und werden vom Image-Puller (Docker-Host/Admission-Controller) verifiziert.
      # Sie sind KEIN Laufzeit-Connect-Gate gegen Forks (ein selbst-gebautes Image
      # laeuft ohne diese Attestation weiter). Nutzen: nachweisbare Echtheit +
      # Detektion; das kryptografische Geraete-Gate ist Stufe 2 (Imaging-Pipeline).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, OIDC/Fulcio/Rekor)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/panary-edge
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/panary-edge
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      # --- Stueckliste (SBOM) des fertigen Images — ADR 0051 ---
      # Signatur und Provenance oben belegen die HERKUNFT, die Stueckliste den
      # INHALT: Welche Pakete stecken in v26.x.y? Erzeugt wird sie aus dem Image
      # per Digest, NICHT aus dem Lockfile — nur so sind die Debian-Pakete des
      # Base-Images drin und node_modules so, wie es wirklich im Image liegt.
      # Kein continue-on-error auf diesen Schritten: Fehlt die Stueckliste,
      # wird der Lauf rot (core#420).
      # syft-version explizit = Default der gepinnten Action. Ein Bump der Action
      # zieht syft so nicht still mit, und die Version steht im Diff.
      - name: Stueckliste erzeugen (syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/panary-edge@${{ steps.docker_build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: panary-edge-${{ steps.version.outputs.tag }}.cdx.json
          syft-version: v1.51.1
          # Ablage steuern wir selbst: Artefakt unten, Release-Asset im
          # Release-Job (mit --latest=false). Die Action wuerde sonst an ein
          # vorhandenes Release anhaengen.
          upload-artifact: false
          upload-release-assets: false

      # Plausibilitaet statt blindem Vertrauen: Eine leere oder nur halbe
      # Stueckliste (z.B. nur OS-Pakete, weil syft node_modules nicht fand) waere
      # sonst ein gruener Lauf mit wertlosem Inhalt. Die 16-MB-Grenze ist die
      # von actions/attest — hier mit Klartext statt kryptischem Abbruch.
      - name: Stueckliste pruefen
        env:
          SBOM: panary-edge-${{ steps.version.outputs.tag }}.cdx.json
        run: |
          set -euo pipefail
          size=$(stat -c %s "$SBOM")
          total=$(jq '.components | length' "$SBOM")
          npm=$(jq '[.components[] | select((.purl // "") | startswith("pkg:npm/"))] | length' "$SBOM")
          deb=$(jq '[.components[] | select((.purl // "") | startswith("pkg:deb/"))] | length' "$SBOM")
          sqlite=$(jq -r '[.components[] | select(.name == "better-sqlite3") | .version] | unique | join(", ")' "$SBOM")
          # Das Runtime-Image fuehrt kein npm-CLI (core#446): dessen node_modules liegen
          # ausserhalb des Lockfiles und damit ausserhalb von osv-scanner und Overrides.
          npmcli=$(jq '[.components[] | select(any((.properties // [])[]; (.name | startswith("syft:location:")) and (.value | test("^/usr/local/lib/node_modules/(npm|corepack)/"))))] | length' "$SBOM")
          {
            echo "### Stueckliste ${SBOM}"
            echo "| Groesse | Komponenten | npm | deb | better-sqlite3 |"
            echo "|---|---|---|---|---|"
            echo "| ${size} B | ${total} | ${npm} | ${deb} | ${sqlite:-–} |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$size" -ge 16000000 ]; then echo "::error::Stueckliste ${size} B >= 16 MB — actions/attest lehnt sie ab"; fail=1; fi
          if [ "$npm" -eq 0 ]; then echo "::error::Stueckliste ohne npm-Komponenten — node_modules im Image nicht erfasst"; fail=1; fi
          if [ "$deb" -eq 0 ]; then echo "::error::Stueckliste ohne deb-Komponenten — Base-Image nicht erfasst"; fail=1; fi
          if [ -z "$sqlite" ]; then echo "::error::better-sqlite3 fehlt in der Stueckliste"; fail=1; fi
          if [ "$npmcli" -ne 0 ]; then echo "::error::${npmcli} Komponenten unter /usr/local/lib/node_modules/npm|corepack — npm-CLI steckt wieder im Runtime-Image (core#446)"; fail=1; fi
          exit "$fail"

      # actions/attest statt cosign attest: dieselbe Mechanik wie die Provenance
      # oben (Sigstore public-good, GitHub-Attestation-API + Registry), also
      # pruefbar mit `gh attestation verify … --predicate-type
      # https://cyclonedx.org/bom`. actions/attest-sbom ist seit v4 nur noch ein
      # als deprecated markierter Wrapper hierauf. Storage-Record aus: braeuchte
      # zusaetzlich `artifact-metadata: write` und traegt fuer die Stueckliste
      # nichts bei.
      - name: Stueckliste an den Image-Digest attestieren
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/panary-edge
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          sbom-path: panary-edge-${{ steps.version.outputs.tag }}.cdx.json
          push-to-registry: true
          create-storage-record: false

      # Auch bei workflow_dispatch (staging-<sha>) — dort ist das die einzige Ablage
      # neben der Attestation; der Release-Job laeuft nur fuer v*-Tags.
      - name: Stueckliste als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-sbom
          path: panary-edge-${{ steps.version.outputs.tag }}.cdx.json
          if-no-files-found: error

  # --- Advisories des fertigen Images — core#448, ADR 0051 Punkt 8 ---
  # Eigener Job, damit ein Befund weder Attestation noch Release-Asset der
  # Stueckliste verhindert: Die Stueckliste beschreibt das Image auch dann, wenn
  # es ein Advisory traegt. Er laeuft NACH dem Push, und `:latest` ist dann schon
  # bewegt (Watchtower). Rot ist hier ein Signal, keine Sperre vor dem Rollout.
  # Regel und Messung: tools/scripts/osv-edge-advisories.sh.
  scan-advisories:
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stueckliste holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-sbom

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Binary statt osv-scanner-action: Die Action faehrt ihr eigenes
      # Ergebnis-Handling und kennt keinen Zwei-Scan-Bericht. Version und
      # Pruefsumme stehen im Diff; ab 2.6.0 liest osv-scanner die CycloneDX-1.7-
      # Stueckliste von syft (2.3.8 lehnte sie ab: "invalid specification version").
      - name: osv-scanner installieren (v2.6.0, Pruefsumme gepinnt)
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Advisories pruefen (npm aus der Stueckliste, Debian aus dem Image)
        env:
          SBOM: panary-edge-${{ needs.build-docker.outputs.tag }}.cdx.json
          IMAGE: ghcr.io/${{ github.repository_owner }}/panary-edge@${{ needs.build-docker.outputs.digest }}
        run: |
          set -uo pipefail
          rc=0
          bash tools/scripts/osv-edge-advisories.sh --sbom "$SBOM" --image "$IMAGE" \
            --config osv-scanner.toml --osv "$RUNNER_TEMP/osv-scanner" > report.md || rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Eigener Job, damit NUR er `contents: write` bekommt — der Build-Job fuehrt
  # Fremd-Actions aus und soll das Repo nicht beschreiben koennen.
  release-sbom:
    needs: build-docker
    if: needs.build-docker.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Stueckliste holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-sbom

      # 🚨 Das Edge-Release darf NIE "Latest" werden. Der POS-Updater fragt
      # releases/latest/download/latest.json (apps/pos-client/src-tauri/
      # tauri.conf.json), und latest.json haengt nur an pos-v*-Releases. Ein
      # Edge-Release als Latest = 404 auf jedem POS, still im UpdateService-catch
      # verschluckt (release-pos.yml). Die Markierung entscheidet, nicht das
      # Datum — deshalb --latest=false bei JEDEM Lauf, auch beim Wiederholen.
      - name: Release zum Tag anlegen und Stueckliste anhaengen (--latest=false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build-docker.outputs.tag }}
          SBOM: panary-edge-${{ needs.build-docker.outputs.tag }}.cdx.json
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SBOM" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$SBOM" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest=false \
              --title "Panary Edge ${TAG}" \
              --notes "Edge-Image \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/panary-edge:${TAG#v}\`. Angehaengt: CycloneDX-Stueckliste des Images (ADR 0051). Kein POS-Release — das POS-Paket kommt ueber die pos-v*-Tags."
          fi
          # Gegenprobe: Ist das Edge-Release trotzdem Latest, faellt der
          # POS-Updater aus. Dann lieber rot als still.
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          if [ "$latest" = "$TAG" ]; then
            echo "::error::${TAG} ist als Latest markiert — der POS-Updater (releases/latest/download/latest.json) liefe in einen 404. Latest von Hand auf das juengste pos-v*-Release setzen."
            exit 1
          fi
          echo "Latest bleibt: ${latest:-<keins>}"
