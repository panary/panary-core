# OSV-Scanner: bewusst akzeptierte Advisories fuer das npm-Lockfile in DIESEM
# Verzeichnis (pnpm-lock.yaml). osv-scanner sucht seine Konfiguration nur im
# Verzeichnis des gescannten Manifests und vererbt sie NICHT an
# Unterverzeichnisse — die Cargo-Ausnahmen des Tauri-Stacks stehen deshalb
# weiterhin getrennt in apps/pos-client/src-tauri/osv-scanner.toml.
#
# Verlauf: docs/security/osv-befund-2026-08-07.md (image-size eingetragen),
# docs/security/osv-befund-2026-09-26.md (image-size entfernt).
# Pendant in panary-cloud/osv-scanner.toml — synchron halten.
#
# Gilt seit core#448 auch fuer die Advisory-Pruefung des Edge-Images
# (tools/scripts/osv-edge-advisories.sh: npm aus der Stueckliste, Debian aus dem
# Image). Ein Eintrag hier nimmt den Befund dort ebenfalls aus — Debian-IDs
# (DEBIAN-CVE-…) betreffen nur das Image.

# --- Befristet akzeptiert -----------------------------------------------------
# scripts/security-scan.mjs reicht diese Datei per --config an osv-scanner
# weiter, damit ein Eintrag fuer jedes gescannte Lockfile gilt — auch fuer die
# Temp-Kopie aus HEAD, die im Haupt-Checkout gescannt wird. `pnpm audit` kennt
# das Advisory unten nicht, ein Gegenstueck dort entfaellt.
# Verlauf: docs/security/osv-befund-2026-10-02-node-forge.md,
# docs/security/osv-befund-2026-10-03-braces-http-cache-semantics.md,
# docs/security/osv-befund-2026-10-27-qs-deepmerge.md,
# docs/security/osv-befund-2026-11-09-minimatch-11-blockiert.md,
# docs/security/osv-befund-2026-11-18-picomatch-chrono.md,
# docs/security/osv-befund-2026-11-24-url-cookie.md,
# docs/security/osv-befund-2026-11-27-glob-minimatch-frist.md.

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"  # glob: Advisory vom 2026-10-30 (CVSS 6.3)
ignoreUntil = 2027-01-08
reason = "Kein Override moeglich: Fix liegt nur in der Major-Version 14 (>= 14.0.2, aktuell 14.0.6), betroffen sind glob 10.5.0 (mocha 11.8.0, test-exclude 7.0.2) und 13.0.7 (@jest/reporters, jest-config, jest-runtime 30.5.2 unter @nx/jest). Ein Override ueber Major-Grenzen bricht die API dieser Konsumenten. Stand 2026-11-27 ist keiner davon auf glob 14 nachgezogen (mocha 12.0.3 und test-exclude 8.0.0 haengen an glob 13 bzw. minimatch ^10.2.2, @jest/reporters 30.5.2 ist die neueste Fassung); glob 14.0.6 zieht nur rimraf 6.1.4. Nur Dev-Abhaengigkeit (pnpm why glob --prod ist leer), nicht im Edge-Image; die Muster stammen aus der eigenen Test- und Build-Konfiguration, nie aus fremdem Input. Eingetragen 2026-10-31 (panary/panary-core#1230), Frist 2026-11-27 verlaengert (docs/security/osv-befund-2026-11-27-glob-minimatch-frist.md); entfernen, sobald die Konsumenten glob >= 14.0.2 ziehen."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"  # minimatch: Advisory vom 2026-10-30 (CVSS 6.9), Range seit 2026-11-05 >= 7.0.0, < 11.0.1
ignoreUntil = 2027-01-08
reason = "Kein Override moeglich: Fix nur in Major 11 (11.0.1+), betroffen sind minimatch 9.0.9 (glob 10.5.0, mocha), 10.2.5 (nx, @nx/devkit, @nx/jest 23.3.1) und 10.2.6 (glob 13.0.7, test-exclude, nodemon, typescript-estree 8.71/8.72); 3.1.5 und 5.1.9 liegen seit der Eingrenzung ausserhalb. minimatch 11 entfernt makeRe und fuellt Minimatch#set mit Matcher-Objekten statt RegExp: nx 23.3.1 ruft minimatch.makeRe auf (TypeError), glob 10/13 pruefen set-Elemente per instanceof RegExp (still falsche Treffer). Stand 2026-11-27: nx 24.0.7 (2026-11-25) und 24.1.0 (2026-11-27) ziehen minimatch 11.0.8, typescript-estree 8.74 zieht ^11.0.1; der nx-Teil ist an das Major-Update nx 24 gebunden (Karenz bis 2026-12-02 bzw. 2026-12-04). Weiter blockierend sind mocha 12.0.3, test-exclude 8.0.0 und @jest/reporters 30.5.2, die an minimatch ^10.2.2 bzw. glob 13 haengen. Nur Dev-Abhaengigkeit (pnpm why minimatch --prod ist leer), nicht im Edge-Image; die Muster stammen aus der eigenen Werkzeug-Konfiguration, nie aus fremdem Input. Eingetragen 2026-10-31 (panary/panary-core#1230), Begruendung 2026-11-09 erneuert (docs/security/osv-befund-2026-11-09-minimatch-11-blockiert.md), Frist 2026-11-27 verlaengert (docs/security/osv-befund-2026-11-27-glob-minimatch-frist.md); entfernen, sobald nx minimatch >= 11.0.1 zieht und kein Konsument mehr glob < 14 aufloest."

