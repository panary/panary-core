# Supply-Chain-Haertung fuer panary-core.
#
# ⚠️ BEWUSST OHNE `packages:`-Key — diese Datei definiert KEINEN Workspace,
# sie traegt ausschliesslich pnpm-Settings. Grund: pnpm liest
# `minimumReleaseAge` & Co. NUR aus einer `pnpm-workspace.yaml`, nicht aus
# `package.json` → `pnpm.*` (empirisch verifiziert mit pnpm 10.34.3, siehe
# docs/adr/0012-pnpm-supply-chain-haertung.md). Ohne diese Datei war die
# Karenz in Core also schlicht nicht vorhanden.
#
# Ein `packages:`-Glob wuerde den Standalone-Install (ci.yml,
# publish-libraries.yml, build-pos-windows.yml) vom heutigen
# Single-Package-Modus auf einen echten Workspace umstellen — mit ~47
# zusaetzlichen Lockfile-Importern und `tools/scripts/link-core-packages.sh`
# als Redundanz. Das ist eine eigene Migration, nicht Teil dieser Haertung.
#
# Die drei Install-Modi von panary-core bleiben damit unveraendert:
#   1. Workbench (`_WORKBENCH_PANARY/`) — der Workbench-Root ist der Workspace,
#      globbt `panary-core/apps/*` etc. Ein verschachteltes
#      `pnpm-workspace.yaml` bricht das NICHT (panary-cloud macht es seit
#      Option A genauso; verifiziert via `pnpm -r list` am Workbench-Root).
#      Im Workbench-Modus gewinnen die Root-Settings — die Keys hier greifen
#      dort nicht, der Root traegt denselben Satz.
#   2. Standalone-CI — kein Workspace, nur das Root-Paket + Symlinks aus
#      `link-core-packages.sh`. Die Settings hier greifen.
#   3. Edge-Docker / POS-Windows-Release — die Workflows haengen ihre
#      `packages:`/`onlyBuiltDependencies:`-Bloecke an DIESE Datei an
#      (frueher: ueberschrieben, wodurch die Haertung still verloren ging).
#      Beim Anpassen synchron halten. build-edge-docker.yml haengt die Karenz
#      fuer seinen Lockfile-Schritt zusaetzlich per
#      `--config.minimumReleaseAge=0` aus — Begruendung dort im Kommentar.
#
# `pnpm.overrides` und `pnpm.onlyBuiltDependencies` bleiben bewusst in der
# package.json: Dependabot pflegt die Override-Liste dort, und ein Umzug
# wuerde den Lockfile-Config-Hash aendern. pnpm liest beide Quellen — ein
# `overrides:`-Key hier wuerde die package.json-Variante still ueberstimmen.

# --- Karenz fuer frisch veroeffentlichte Versionen (7 Tage = 10080 Min.) ---
# Kompromittierte Pakete werden meist innerhalb dieser Frist entdeckt. Greift
# bei der Resolution (`pnpm add/update`, `--lockfile-only` ohne Lockfile);
# ein Install gegen ein vorhandenes Lockfile bleibt unberuehrt. Ab pnpm 10.16.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # First-Party: von der eigenen Core-CI publiziert, kein Third-Party-Risiko.
  # Der Option-A-Release-Flow (Core-Release → sofortiger Cloud-Pin-Bump) setzt
  # voraus, dass sie unmittelbar konsumierbar sind. Ohne diesen Eintrag faellt
  # das Lockfile still auf die vorige Version zurueck.
  - '@panary/*'
  #
  # --- Befristete Ausnahmen: aktuell KEINE ------------------------------------
  # Ein Paket gehoert nur so lange hierher, wie sein package.json-Override auf
  # eine Version zeigt, die die Karenz noch blockiert — sonst scheitert jede
  # vollstaendige Neuaufloesung (Edge-Docker, POS-Windows-Release) mit
  # ERR_PNPM_NO_MATURE_MATCHING_VERSION (empirisch verifiziert 2026-07-25).
  # Sobald die Version reif ist, MUSS der Eintrag weg: danach ist er ein stiller
  # Verzicht auf die Karenz fuer genau das Paket, das gerade erst gepatcht wurde.
  # Jeder Eintrag traegt deshalb sein Reife-Datum im Zeilenkommentar.
  #
  # Entfernt am 2026-08-11, weil reif geworden: 'fast-uri' (3.1.5, publiziert
  # 2026-07-31 09:16 UTC → reif seit 2026-08-07), 'js-yaml' (4.3.1, 2026-07-31
  # 17:39 UTC → 2026-08-07), 'hono' (4.12.34, 2026-08-03 02:36 UTC → 2026-08-10)
  # und 'nanoid' (3.3.17, 2026-08-03 10:39 UTC → 2026-08-10). Termin stand in
  # docs/security/osv-befund-2026-08-07.md. Im selben Zug wurde der
  # nanoid-Override von EXAKT '3.3.17' auf '^3.3.17' gelockert — ein stehender
  # Exakt-Pin blockiert kuenftige Patches. Er loest weiterhin auf 3.3.17 auf,
  # weil 3.3.18 (2026-08-07 16:41 UTC) erst am 2026-08-14 reif wird; genau das
  # ist das gewuenschte Verhalten.
  # Entfernt am 2026-08-07, weil reif geworden: die neun '@angular/*'-Framework-
  # Pakete (21.2.19, reif seit 2026-08-05, GHSA-jhpw-976m-542j / GHSA-jj27-h5hq-8x99)
  # und 'brace-expansion' (5.0.9, reif seit 2026-08-06, GHSA-rgw5-rvv9-x895).
  # Das Lockfile bewegt sich dadurch nicht: die gepinnten Versionen erfuellen
  # ihre Ranges auch unter der Karenz — verifiziert mit --lockfile-only.
  # Entfernt am 2026-08-03, weil reif geworden: 'tar' (7.5.21/22, PR #57) und
  # '@hono/node-server' (2.0.11/12, PR #55) — beide seit 2026-07-28 reif.
  # ip-address ^10.2.1, socket.io-parser ^4.2.7 und undici ^7.29.0 (OSV-Sweep
  # 2026-08-03) brauchen KEIN Exclude — ihre Fix-Versionen sind reif.

# --- Transitive Deps nur aus vertrauenswuerdigen Quellen (ab pnpm 10.26) ---
blockExoticSubdeps: true

# --- Kein Downgrade von Trust-Evidenz (Provenance-Attestation, ab pnpm 10.21) ---
trustPolicy: no-downgrade
# Ohne dieses Ventil bricht jede vollstaendige Neuaufloesung an etablierten
# Alt-Paketen ab, die vor der Provenance-Aera veroeffentlicht wurden —
# konkret `chokidar@4.0.3` (2024-12-18, via mocha) mit
# ERR_PNPM_TRUST_DOWNGRADE. 43200 Min. = 30 Tage: Trust-Downgrades werden nur
# noch fuer Versionen geprueft, die juenger als 30 Tage sind — genau das
# Zeitfenster, in dem eine Paketuebernahme relevant ist.
trustPolicyIgnoreAfter: 43200
