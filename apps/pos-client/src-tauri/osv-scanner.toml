# OSV-Scanner: bewusst akzeptierte Advisories für die Tauri-Rust-Deps des POS
# (Cargo.lock in diesem Verzeichnis): unmaintained-Crates ohne Fix bzw.
# Transitiv-Deps, die an Tauri-Plugins gebunden und nicht isoliert bumpbar sind.
# Jeder Eintrag nennt Parent, Plattform und Exposure; neue Einträge mit ignoreUntil.
# Scope: nur diese Datei (Auto-Discovery neben Cargo.lock) — pnpm-Scan bleibt streng.

# glib: osv-scanner meldet den Befund unter der GHSA-ID und filtert den
# RUSTSEC-Alias automatisch mit ("… and 1 alias have been filtered out").
# Ein zusaetzlicher RUSTSEC-2024-0429-Eintrag bliebe ungenutzt und wuerde als
# "has unused ignores" gemeldet — deshalb nur die GHSA-ID.
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"  # glib (Alias: RUSTSEC-2024-0429)
reason = "gtk-rs glib 0.18 (CVSS 6.9 Medium). Fix erst mit glib 0.20 — an den gtk-rs/Tauri-GTK3-Stack gebunden, nicht isoliert bumpbar. Bewusst akzeptiert bis Tauri-Stack-Upgrade."

