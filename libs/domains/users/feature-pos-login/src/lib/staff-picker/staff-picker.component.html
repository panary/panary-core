@if (users().length === 0) {
  <div class="text-center py-12">
    <p class="text-ink-muted text-sm">{{ 'LOGIN.NO_POS_USERS' | translate }}</p>
    <p class="text-ink-faint text-xs mt-1">{{ 'LOGIN.CREATE_POS_USERS' | translate }}</p>
  </div>
} @else {
  <div
    class="grid grid-cols-[repeat(auto-fill,minmax(9.5rem,1fr))] auto-rows-[5.25rem] gap-2.5"
    data-testid="staff-grid"
  >
    @for (user of sorted(); track user._id) {
      <button
        type="button"
        class="flex flex-col items-center justify-center gap-1.5 rounded-[0.875rem] border border-pos-key-line bg-pos-key text-sm font-semibold text-ink hover:bg-surface-panel active:bg-surface-elevated transition-colors"
        (click)="picked.emit(user)"
      >
        <span
          class="size-10 rounded-full flex items-center justify-center text-sm font-bold"
          [style]="monogram(user._id)"
          >{{ user.initials }}</span
        >
        <span class="w-full truncate text-center">{{ shortName(user) }}</span>
      </button>
    }
  </div>
}
