# OSV-Scanner: bewusst akzeptierte Advisories fuer das npm-Lockfile in DIESEM
# Verzeichnis (pnpm-lock.yaml). osv-scanner sucht seine Konfiguration nur im
# Verzeichnis des gescannten Manifests und vererbt sie NICHT an
# Unterverzeichnisse — die Cargo-Ausnahmen des Tauri-Stacks stehen deshalb
# weiterhin getrennt in apps/pos-client/src-tauri/osv-scanner.toml.
#
# Verlauf: docs/security/osv-befund-2026-08-07.md (image-size eingetragen),
# docs/security/osv-befund-2026-09-26.md (image-size entfernt).
# Pendant in panary-cloud/osv-scanner.toml — synchron halten.
#
# Gilt seit core#448 auch fuer die Advisory-Pruefung des Edge-Images
# (tools/scripts/osv-edge-advisories.sh: npm aus der Stueckliste, Debian aus dem
# Image). Ein Eintrag hier nimmt den Befund dort ebenfalls aus — Debian-IDs
# (DEBIAN-CVE-…) betreffen nur das Image.

# --- Befristet akzeptiert -----------------------------------------------------
# scripts/security-scan.mjs reicht diese Datei per --config an osv-scanner
# weiter, damit ein Eintrag fuer jedes gescannte Lockfile gilt — auch fuer die
# Temp-Kopie aus HEAD, die im Haupt-Checkout gescannt wird. `pnpm audit` kennt
# das Advisory unten nicht, ein Gegenstueck dort entfaellt.
# Verlauf: docs/security/osv-befund-2026-10-02-node-forge.md,
# docs/security/osv-befund-2026-10-03-braces-http-cache-semantics.md,
# docs/security/osv-befund-2026-10-27-qs-deepmerge.md,
# docs/security/osv-befund-2026-11-09-minimatch-11-blockiert.md.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"  # deepmerge: mergeObject() erlaubt Prototype-Poisoning des Ergebnisobjekts (CVSS 5.3)
ignoreUntil = 2026-11-27
reason = "Kein Fix: betroffen ist 4.2.0 bis 4.3.1 (last_affected), und 4.3.1 (2023-03-16) ist die neueste deepmerge-Version. Advisory am 2026-10-27 21:45 UTC geaendert, seitdem meldet osv-scanner es. Nur Dev-Abhaengigkeit (@rollup/plugin-node-resolve unter @nx/rollup, fork-ts-checker-webpack-plugin unter @nx/webpack, jest-config unter @nx/jest), nicht im Edge-Image (pnpm why deepmerge --prod ist leer). Gemergt werden nur Build- und Test-Konfigurationen aus dem eigenen Repo, nie fremder Input. Eingetragen 2026-10-27 (panary/panary-core#1163, Pendant panary/panary-cloud#1482); bei Fix-Version per Override heben und Eintrag entfernen."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"  # glob: Advisory vom 2026-10-30 (CVSS 6.3)
ignoreUntil = 2026-11-27
reason = "Kein Override moeglich: Fix liegt nur in der Major-Version 14.0.2 (seit 2026-10-27 22:07 UTC, Karenz bis 2026-11-03), betroffen sind glob 10.5.0 (mocha, test-exclude) und 13.0.6 (@jest/reporters unter @nx/jest). Ein Override ueber Major-Grenzen bricht die API dieser Konsumenten. Nur Dev-Abhaengigkeit (pnpm why glob --prod ist leer), nicht im Edge-Image; die Muster stammen aus der eigenen Test- und Build-Konfiguration, nie aus fremdem Input. Eingetragen 2026-10-31 (panary/panary-core#1230); entfernen, sobald die Konsumenten glob >= 14.0.2 ziehen."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"  # minimatch: Advisory vom 2026-10-30 (CVSS 6.9), Range seit 2026-11-05 >= 7.0.0, < 11.0.1
ignoreUntil = 2026-11-27
reason = "Kein Override moeglich: Fix nur in Major 11 (11.0.1+), betroffen sind minimatch 9.0.9 (glob 10.5.0, mocha), 10.2.5 (nx, @nx/devkit, @nx/jest) und 10.2.6 (glob 13.0.6, test-exclude, nodemon, typescript-estree); 3.1.5 und 5.1.9 liegen seit der Eingrenzung ausserhalb. minimatch 11 entfernt makeRe (Funktion und Methode) und fuellt Minimatch#set mit Matcher-Objekten statt RegExp: nx 23.3.1 ruft minimatch.makeRe auf (TypeError), glob 10/13 pruefen set-Elemente per instanceof RegExp (still falsche Treffer). Upstream am 2026-11-09 nicht nachgezogen: nx 24.0.5 pinnt 10.2.5, test-exclude 8, mocha 12, @jest/reporters 30.5 ziehen glob 13; nur glob 14 nutzt minimatch 11. Nur Dev-Abhaengigkeit (pnpm why minimatch --prod ist leer), nicht im Edge-Image; die Muster stammen aus der eigenen Werkzeug-Konfiguration, nie aus fremdem Input. Eingetragen 2026-10-31 (panary/panary-core#1230), Begruendung 2026-11-09 erneuert (docs/security/osv-befund-2026-11-09-minimatch-11-blockiert.md); entfernen, sobald nx minimatch >= 11.0.1 zieht und kein Konsument mehr glob < 14 aufloest."

