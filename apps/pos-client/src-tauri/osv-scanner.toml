# --- Befristet akzeptiert: zbus-Teilcrates unmaintained (panary/panary-core#744) --
# Kein Fix-Release: zvariant, zvariant_derive und zbus_names sind seit zbus 6.0.0
# (2026-10-16, unter 7-Tage-Karenz) in zbus aufgegangen. Einziger Parent zbus 5.x
# über tauri-plugin-opener, das bis zur neuesten 2.x (2.7.2) zbus ^5.9 verlangt.
# Plattform: zbus ist nur für Linux/BSD eingebunden (D-Bus); build-pos.yml baut
# Windows und macOS, kein ausgeliefertes POS-Artefakt enthält den Pfad.
# Reine Unmaintained-Meldungen, keine bekannte Schwachstelle.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"  # zvariant unmaintained
ignoreUntil = 2026-12-15
reason = "In zbus 6 aufgegangen; tauri-plugin-opener 2.7.2 (neueste 2.x) verlangt zbus ^5.9. Nur Linux/BSD-Pfad, kein Linux-Build in build-pos.yml. Re-evaluieren, sobald opener zbus 6 erlaubt."

