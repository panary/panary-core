# ============================================================
# Panary Edge Server — Prod-Test (Named Volume)
#
# Isolierter Container mit eigenem Docker-Volume.
# Verhält sich wie im Echtbetrieb — keine Verbindung zum Projektordner.
# Daten: docker volume inspect panary-edge-data
#
# Nutzung:
#   docker compose -f tools/docker/docker-compose.edge.yml up -d
#   docker compose -f tools/docker/docker-compose.edge.yml down
#   docker compose -f tools/docker/docker-compose.edge.yml down -v   # auch Volume löschen
#
# Netzwerk: host — zwingend für mDNS-Auto-Discovery (siehe unten).
# Nur unter Linux verfügbar; auf Docker Desktop (macOS/Windows) greift
# host-networking nicht für Multicast — dort bleibt QR/manuelle IP der Weg.
# ============================================================
services:
  panary-edge:
    image: ghcr.io/panary/panary-edge:latest
    build:
      context: ../..
      dockerfile: tools/docker/Dockerfile.edge
    pull_policy: build
    container_name: panary-edge
    # mDNS (`_panary._tcp`) ist Multicast auf 224.0.0.251:5353 mit TTL 1: Pakete
    # aus einem Bridge-Netz erreichen das physische LAN nie, und der annoncierte
    # A-Record waere die Container-IP (172.x) — der POS-Wizard bekaeme eine URL,
    # die es im LAN nicht gibt. Host-Networking legt den Edge in den Netzstack
    # des Hosts: echte LAN-IP im A-Record, Multicast erreicht die Clients.
    # Konsequenz: kein `ports:`-Mapping — Port 3030 liegt direkt am Host.
    network_mode: host
    volumes:
      - panary-edge-data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3030/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ============================================================
  # MQTT-Broker (Mosquitto) — Transport fuer den Print-Server.
  #
  # Muss deckungsgleich zu dem Service bleiben, den install.sh beim Kunden
  # generiert — sonst testet dieses Compose eine Konstellation, die es im Feld
  # nicht gibt.
  #
  # Der Edge selbst spricht kein MQTT (das Backend bedient nur IP-Drucker,
  # siehe print-job.builder.ts). Publisher ist die POS-App per
  # MQTT-over-WebSocket, Subscriber sind Drucker bzw. Print-Bridges im Netz.
  #
  # Host-Networking wie beim Edge: der Broker lauscht direkt auf der LAN-IP,
  # ohne NAT dazwischen. Deshalb kein `ports:` — im Host-Mode wirkungslos.
  #
  # Zustandslos: der POS publiziert mit clean-session und QoS 0, es gibt weder
  # Retained Messages noch Offline-Queues. Kein Volume noetig.
  # ============================================================
  panary-mqtt:
    image: eclipse-mosquitto:2
    container_name: panary-mqtt
    network_mode: host
    configs:
      - source: mosquitto-conf
        target: /mosquitto/config/mosquitto.conf
    restart: unless-stopped
    healthcheck:
      # $$SYS statt $SYS: Compose interpoliert den String sonst und der Topic
      # waere leer.
      test: ['CMD', 'mosquitto_sub', '-h', '127.0.0.1', '-p', '1883', '-t', '$$SYS/broker/uptime', '-C', '1', '-W', '3']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  panary-edge-data:

configs:
  mosquitto-conf:
    # Inline statt separatem File — haelt die Broker-Konfiguration an genau
    # einer Stelle. Setzt Compose 2.23.1+ voraus.
    content: |
      # Mosquitto 2.x bindet ohne expliziten Listener nur an localhost und
      # weist anonyme Clients ab — fuer den POS waere beides toedlich.
      # Listener ohne Bind-Adresse = alle Interfaces; im Host-Mode also
      # direkt die LAN-IP, ohne dass hier eine IP eingetragen werden muss.
      # allow_anonymous gilt global, nicht pro Listener.
      allow_anonymous true

      listener 1883
      protocol mqtt

      listener 9001
      protocol websockets

      persistence false

      log_dest stdout
      log_type error
      log_type warning
      log_type notice
